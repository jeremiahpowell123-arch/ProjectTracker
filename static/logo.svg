<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ProjectTracker">
  <defs>
    <linearGradient id="pt-bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5A9"/>
    </linearGradient>
    <clipPath id="pt-clip"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#pt-bg)"/>

  <g clip-path="url(#pt-clip)">
    <!-- stairwell walls, narrowing toward the top -->
    <polygon points="2.6,70 61.4,70 41,10 23,10" fill="#FFFFFF" fill-opacity="0.12"/>
  </g>

  <!-- stairs seen from the bottom looking up: each step is smaller and higher -->
  <rect x="13"   y="43"   width="38" height="9"   rx="1.6" fill="#FFFFFF"/>
  <rect x="17"   y="33.5" width="30" height="7.5" rx="1.5" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="20.5" y="25.5" width="23" height="6"   rx="1.3" fill="#FFFFFF" fill-opacity="0.78"/>
  <rect x="23.5" y="19"   width="17" height="4.5" rx="1.1" fill="#FFFFFF" fill-opacity="0.66"/>
  <rect x="26"   y="13.5" width="12" height="3.5" rx="1"   fill="#FFFFFF" fill-opacity="0.55"/>
</svg>