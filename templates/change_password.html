{% extends "app_base.html" %}
{% block title %}Change password · ProjectTracker{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Change password</h1>
  <p class="muted">Use at least 8 characters. If an administrator gave you a temporary password, replace it here.</p>
</div>

<form method="post" class="card panel settings-card">
{{ csrf_field() }}
  <label for="cp-current">Current password</label>
  <input id="cp-current" name="current" type="password" autocomplete="current-password" required>
  <label for="cp-new">New password</label>
  <input id="cp-new" name="new" type="password" autocomplete="new-password" minlength="8" required>
  <label for="cp-again">Confirm new password</label>
  <input id="cp-again" name="again" type="password" autocomplete="new-password" minlength="8" required>
  <button class="btn" type="submit">Change password</button>
</form>
{% endblock %}
